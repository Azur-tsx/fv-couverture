name: CI

on:
  push:
    branches: [dev, live, main]
  pull_request:
    branches: [live, main]

jobs:
  build:
    name: Build et vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vérifier le HTML, les liens et la CSP
        run: npm run check
